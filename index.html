    <!-- Критичен CSS: фон + входна завеса (показва се преди да се зареди пакетът) -->
    <style>
      @property --iris { syntax: "<length>"; inherits: true; initial-value: 0px; }
      html { background: #0d0b0a; }
      body { margin: 0; }
      .pl { position: fixed; inset: 0; z-index: 9999; --ix: 50vw; --iy: 50vh; --d0: 0px; color: #f7f3ec;
        animation: pl-bail .4s ease 4.6s forwards; }
      .pl__curtain, .pl__ring { position: absolute; inset: 0; }
      .pl__curtain { background: #0d0b0a; --w: calc(var(--d0) + var(--iris)); }
      .pl__ring { display: none; }
      .pl__ring--1 { background: #00dfd8; --w: calc(var(--iris) * .93); }
      .pl__ring--2 { background: #0070f3; --w: calc(var(--iris) * .86); }
      .pl__center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1.5rem; }
      .pl__word { font: 700 clamp(2.1rem, 9.5vw, 4.4rem)/1 'Unbounded Variable', 'Unbounded', system-ui, sans-serif; letter-spacing: -.03em; white-space: nowrap; }
      .pl__letters { display: inline-block; }
      .pl__t { animation: pl-pulse 1.4s ease-in-out infinite alternate; }
      .pl__i { position: relative; display: inline-block; }
      .pl__dot { position: absolute; left: 50%; top: .035em; width: .2em; height: .2em; margin-left: -.1em; border-radius: 50%; background: #00dfd8; }
      .pl__dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #00dfd8; animation: pl-ping 1.4s ease-out infinite; }
      .pl__bar { width: min(46vw, 190px); height: 2px; border-radius: 2px; background: rgba(247, 243, 236, .14); overflow: hidden; }
      .pl__bar i { display: block; height: 100%; background: linear-gradient(90deg, #0070f3, #00dfd8); transform-origin: 0 50%; transform: scaleX(0); animation: pl-load 3.4s cubic-bezier(.12, .7, .2, 1) forwards; }
      @keyframes pl-pulse { to { opacity: .5; } }
      @keyframes pl-ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
      @keyframes pl-load { to { transform: scaleX(.92); } }
      @keyframes pl-bail { to { opacity: 0; visibility: hidden; } }
      /* Изход без движение (prefers-reduced-motion): обикновено избледняване за 0.4 сек */
      .pl--out { animation: none; opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s .4s; }
      /* Изход с ирис: анимира се единствено регистрираната променлива --iris */
      .fx .pl--go { animation: pl-iris 2.05s linear forwards; }
      .fx .pl--go .pl__ring { display: block; }
      .fx .pl--go .pl__curtain, .fx .pl--go .pl__ring {
        -webkit-mask-image: radial-gradient(circle closest-side, #000 calc(100% - 1px), transparent), linear-gradient(#000 0 0);
        mask-image: radial-gradient(circle closest-side, #000 calc(100% - 1px), transparent), linear-gradient(#000 0 0);
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-size: var(--w) var(--w), 100% 100%; mask-size: var(--w) var(--w), 100% 100%;
        -webkit-mask-position: calc(var(--ix) - var(--w) / 2) calc(var(--iy) - var(--w) / 2), 0 0;
        mask-position: calc(var(--ix) - var(--w) / 2) calc(var(--iy) - var(--w) / 2), 0 0;
        -webkit-mask-composite: xor; mask-composite: exclude;
      }
      .fx .pl--go .pl__dot { opacity: 0; }
      .fx .pl--go .pl__letters { transform: scale(.78); opacity: 0; transition: transform .55s cubic-bezier(.5, 0, .2, 1), opacity .3s ease; }
      .fx .pl--go .pl__bar { opacity: 0; transition: opacity .25s ease; }
      @keyframes pl-iris {
        0%, 12% { --iris: 0px; animation-timing-function: cubic-bezier(.2, .9, .25, 1); }
        36% { --iris: 50vmin; animation-timing-function: ease-in-out; }
        46% { --iris: 43vmin; animation-timing-function: ease-in-out; }
        56% { --iris: 45.5vmin; animation-timing-function: cubic-bezier(.7, 0, .84, .12); }
        100% { --iris: 380vmax; }
      }
    </style>
    <script>
      /* html.fx се слага само ако няма prefers-reduced-motion; целият код за движение е под този клас. */
      (function () {
        var d = document, h = d.documentElement;
        var fx = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (fx) h.classList.add('fx');
        var done = false;
        window.__dxReveal = function () {
          if (done) return;
          done = true;
          var pl = d.getElementById('preloader');
          if (!pl) { h.classList.add('ready'); return; }
          if (!fx) {
            pl.classList.add('pl--out');
            h.classList.add('ready');
            setTimeout(function () { pl.remove(); }, 450);
            return;
          }
          /* Отворът тръгва точно от точката на „i“ – мерим я и я подаваме като център на маската. */
          var dot = pl.querySelector('.pl__dot'), letters = pl.querySelector('.pl__letters');
          var r = dot.getBoundingClientRect(), lr = letters.getBoundingClientRect();
          var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          pl.style.setProperty('--ix', cx + 'px');
          pl.style.setProperty('--iy', cy + 'px');
          pl.style.setProperty('--d0', r.width + 'px');
          letters.style.transformOrigin = (cx - lr.left) + 'px ' + (cy - lr.top) + 'px';
          pl.classList.add('pl--go');
          /* Входът на hero започва, докато отворът още расте. */
          setTimeout(function () { h.classList.add('ready'); }, 900);
          var kill = function () { if (pl.parentNode) pl.remove(); };
          pl.addEventListener('animationend', function (e) { if (e.animationName === 'pl-iris') kill(); });
          setTimeout(kill, 2600);
        };
        /* Предпазител: ако нещо не се зареди, завесата се маха сама. */
        setTimeout(window.__dxReveal, 4200);
      })();
    </script>
